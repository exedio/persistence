# Standard appenders

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.Threshold=INFO
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%-5p [%c{1}] %m%n

log4j.appender.FILE=org.apache.log4j.DailyRollingFileAppender
log4j.appender.FILE.File=build/log4j/console.log
log4j.appender.FILE.DatePattern='.'yyyy-MM-dd
log4j.appender.FILE.Threshold=INFO
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss:SSS}] %-5p [%c{1}]: %m%n

log4j.appender.MediaServlet=org.apache.log4j.FileAppender
log4j.appender.MediaServlet.File=MediaServlet.log
log4j.appender.MediaServlet.Threshold=DEBUG
log4j.appender.MediaServlet.ImmediateFlush=true
log4j.appender.MediaServlet.layout=org.apache.log4j.EnhancedPatternLayout
log4j.appender.MediaServlet.layout.ConversionPattern=%p [%c]: %m%n%throwable{2}
log4j.logger.com.exedio.cope.pattern.MediaServlet=DEBUG, MediaServlet


# Global loggers

log4j.rootLogger=INFO, FILE, CONSOLE


# exedio library loggers


# 3rd party library loggers

log4j.logger.org.apache.fop=ERROR
log4j.logger.org.apache.wicket=INFO
log4j.logger.org.apache.wicket.protocol.http.HttpSessionStore=INFO
log4j.logger.org.apache.wicket.version=INFO
log4j.logger.org.apache.wicket.RequestCycle=INFO

# Project loggers

log4j.logger.com.exedio.copedemo=INFO

